[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-memeval"
version = "1.0.0"
description = "Dual-timeline conversational memory dataset and MemBase-derived evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "openai>=1.3.7", "litellm>=1.75.9",
  "smartcomment", "tqdm>=4.66", "tiktoken", "tokenizers",
  "huggingface-hub", "nltk>=3.8.1", "rouge-score"
]

[tool.setuptools.packages.find]
include = ["membase*"]
exclude = ["membase.layers.LightMem*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]
